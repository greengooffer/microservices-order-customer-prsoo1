openapi: 3.0.0
info:
  title: Customer Service API
  version: 1.0.0
  description: API для управління клієнтами

paths:
  /customers/{id}:
    get:
      summary: Отримати інформацію про клієнта
      description: Повертає дані клієнта за його ідентифікатором
      parameters:
        - name: id
          in: path
          required: true
          description: Унікальний ідентифікатор клієнта
          schema:
            type: string
      responses:
        '200':
          description: Успішна відповідь з даними клієнта
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "c123"
                  firstName:
                    type: string
                    example: "Oleksandr"
                  lastName:
                    type: string
                    example: "Isaiev"
                  email:
                    type: string
                    format: email
                    example: "oleksandr@example.com"
                  phone:
                    type: string
                    example: "+380XXXXXXXXX"
                  addresses:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          example: "delivery"
                        street:
                          type: string
                          example: "Shevchenko St."
                        city:
                          type: string
                          example: "Kyiv"
                        postalCode:
                          type: string
                          example: "01001"
                        country:
                          type: string
                          example: "Ukraine"
        '404':
          description: Клієнта не знайдено